<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{padding:24px;background:var(--bg-app);font-family:var(--font-sans);display:flex;gap:32px;align-items:center}
  .demo{display:flex;flex-direction:column;align-items:center;gap:10px}
  .card{width:160px;height:90px;background:#fff;border:1px solid var(--border-1);border-radius:12px}
  .fab{width:56px;height:56px;border-radius:28px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:300;box-shadow:0 2px 3.84px rgba(0,0,0,.25)}
  .lbl{font-size:11px;color:var(--fg-6);text-align:center;line-height:1.4}
  .lbl b{color:var(--fg-2);font-weight:600;display:block;font-size:12px}
  .note{font-size:12px;color:var(--fg-5);max-width:260px;line-height:1.5}
</style></head>
<body>
  <div class="demo"><div class="card"></div><div class="lbl"><b>Card</b>1px #e0e0e6 border,<br>no shadow</div></div>
  <div class="demo"><div class="fab">+</div><div class="lbl"><b>FAB</b>0 2 3.84 rgba(0,0,0,.25)</div></div>
  <div class="note">Motiff has exactly one shadow in the product — on the <b>+ Courses</b> FAB. Everything else sits flat on a hairline border.</div>
</body></html>
