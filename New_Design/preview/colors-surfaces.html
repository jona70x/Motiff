<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{padding:16px;background:#fbfaff;font-family:"Nunito",sans-serif}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(91,61,245,.06), 0 0 0 1px rgba(91,61,245,.08)}
  .box{height:86px}
  .cap{padding:8px 10px;background:#fff}
  .name{font-size:11px;font-weight:700;color:var(--fg-2)}
  .hex{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--fg-5);margin-top:2px;font-weight:500}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="box" style="background:#fbfaff"></div><div class="cap"><div class="name">bg-app</div><div class="hex">#fbfaff</div></div></div>
  <div class="card"><div class="box" style="background:#ffffff"></div><div class="cap"><div class="name">bg-surface</div><div class="hex">#ffffff</div></div></div>
  <div class="card"><div class="box" style="background:#f7f5ff"></div><div class="cap"><div class="name">bg-surface-2</div><div class="hex">#f7f5ff</div></div></div>
  <div class="card"><div class="box" style="background:#ece6ff"></div><div class="cap"><div class="name">bg-press</div><div class="hex">#ece6ff</div></div></div>
  <div class="card"><div class="box" style="background:#efeaff"></div><div class="cap"><div class="name">bg-chip</div><div class="hex">#efeaff</div></div></div>
  <div class="card"><div class="box" style="background:#fff2e6"></div><div class="cap"><div class="name">bg-accent-soft</div><div class="hex">#fff2e6</div></div></div>
  <div class="card"><div class="box" style="background:#1e1a3a"></div><div class="cap"><div class="name">bg-undo</div><div class="hex">#1e1a3a</div></div></div>
  <div class="card"><div class="box" style="background:#0a0a0a"></div><div class="cap"><div class="name">bg-dark</div><div class="hex">#0a0a0a</div></div></div>
</div>
</body></html>
