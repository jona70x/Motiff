<!doctype html>
<html><head><meta charset="utf-8"><title>Kind badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{padding:24px;background:var(--bg-surface);font-family:var(--font-sans);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .b{border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;text-transform:capitalize}
  .note{flex-basis:100%;font-size:11px;color:var(--fg-6);margin-top:8px;font-family:var(--font-mono)}
</style></head>
<body>
  <span class="b" style="background:#ffebee;color:#b00020">exam</span>
  <span class="b" style="background:#e3f2fd;color:#1565c0">assignment</span>
  <span class="b" style="background:#f3e5f5;color:#6a1b9a">project</span>
  <span class="b" style="background:#e8f5e9;color:#2e7d32">reading</span>
  <span class="b" style="background:#f5f5f5;color:#555">other</span>
  <div class="note">5 kinds · 4/4 radius · tint bg + solid fg · lowercase + capitalize</div>
</body></html>
