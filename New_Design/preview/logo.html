<!doctype html>
<html><head><meta charset="utf-8"><title>Motiff logotype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background: radial-gradient(120% 140% at 20% 10%, #fff2e6 0%, #fbfaff 45%, #efeaff 100%);
    padding:24px;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .wordmark{
    font-family:"Bricolage Grotesque","Nunito",sans-serif;
    font-weight:800;
    font-size:76px;
    letter-spacing:-0.035em;
    line-height:1;
    background: linear-gradient(92deg, #5b3df5 0%, #7a5cff 45%, #ff7a59 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variation-settings: "opsz" 96;
    display:inline-flex;align-items:center;gap:2px;
  }
  .dot{
    width:14px;height:14px;border-radius:50%;
    background:#ffd447;
    box-shadow:0 2px 10px rgba(255,212,71,.6);
    margin:0 1px 12px 4px;
    display:inline-block;
  }
  .sub{
    font-family:"Nunito",sans-serif;
    font-size:11px;color:var(--fg-5);
    text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  }
</style></head>
<body>
  <div class="wrap">
    <div class="wordmark">motiff<span class="dot"></span></div>
    <div class="sub">Bricolage Grotesque · 800 · tracked -3.5%</div>
  </div>
</body></html>
