<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{padding:16px;background:var(--bg-surface);font-family:var(--font-sans)}
  .row{display:flex;gap:12px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:#111;border-radius:2px;width:18px}
  .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-6)}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="bar" style="height:4px"></div><div class="n">4</div></div>
  <div class="cell"><div class="bar" style="height:6px"></div><div class="n">6</div></div>
  <div class="cell"><div class="bar" style="height:8px"></div><div class="n">8</div></div>
  <div class="cell"><div class="bar" style="height:10px"></div><div class="n">10</div></div>
  <div class="cell"><div class="bar" style="height:12px"></div><div class="n">12</div></div>
  <div class="cell"><div class="bar" style="height:14px"></div><div class="n">14</div></div>
  <div class="cell"><div class="bar" style="height:16px"></div><div class="n">16</div></div>
  <div class="cell"><div class="bar" style="height:20px"></div><div class="n">20</div></div>
  <div class="cell"><div class="bar" style="height:24px"></div><div class="n">24</div></div>
  <div class="cell"><div class="bar" style="height:32px"></div><div class="n">32</div></div>
  <div class="cell"><div class="bar" style="height:40px"></div><div class="n">40</div></div>
</div>
</body></html>
