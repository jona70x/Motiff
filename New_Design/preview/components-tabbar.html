<!doctype html>
<html><head><meta charset="utf-8"><title>Tab bar</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%}
  body{
    padding:22px;
    background: linear-gradient(135deg,#fbfaff 0%, #fff 60%, #fff2e6 100%);
    font-family:"Nunito",sans-serif;
    display:flex;flex-direction:column;gap:14px;align-items:center;
  }

  /* Floating tab bar — soft indigo halo, elevated from the app surface */
  .bar{
    display:flex;justify-content:space-around;align-items:stretch;
    width:100%;max-width:520px;
    background:#fff;border-radius:22px;padding:8px 6px 10px;
    box-shadow:
      0 1px 2px rgba(26,22,51,.06),
      0 10px 28px rgba(91,61,245,.14),
      0 0 0 1px rgba(91,61,245,.08);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 0;cursor:pointer;
    position:relative;color:#adaacc;
    border-radius:14px;
    transition:color 160ms ease, background 160ms ease;
  }
  .tab .ico{
    width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  }
  .tab .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab .lbl{
    font-size:11px;font-weight:800;letter-spacing:.2px;
  }

  /* Active tab — indigo pill with a peach dot */
  .tab.on{
    color:#5b3df5;background:#efeaff;
  }
  .tab.on .ico svg{stroke-width:2.4}
  .tab.on .lbl{color:#1a1633}
  .tab.on::after{
    content:"";position:absolute;top:4px;right:14px;
    width:6px;height:6px;border-radius:50%;
    background:#ff7a59;box-shadow:0 0 0 3px rgba(255,122,89,.22);
  }

  /* Onboarding dot pager — stadium active dot */
  .dots{display:flex;gap:8px;margin-top:6px}
  .dot{
    width:8px;height:8px;border-radius:4px;background:#d6d4e8;
    transition:width 200ms ease, background 200ms ease;
  }
  .dot.active{
    width:22px;
    background: linear-gradient(90deg,#5b3df5,#ff7a59);
  }

  .cap{
    font-size:11px;color:#827ea5;font-family:"JetBrains Mono",monospace;
    font-weight:500;margin-top:2px;
  }
</style></head>
<body>

<div class="bar">
  <div class="tab on">
    <span class="ico"><!-- Today: sun -->
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </span>
    <span class="lbl">Today</span>
  </div>
  <div class="tab">
    <span class="ico"><!-- Plan: list-checks -->
      <svg viewBox="0 0 24 24"><path d="M3 5l2 2 4-4"/><path d="M3 12l2 2 4-4"/><path d="M3 19l2 2 4-4"/><path d="M13 6h8"/><path d="M13 13h8"/><path d="M13 20h8"/></svg>
    </span>
    <span class="lbl">Plan</span>
  </div>
  <div class="tab">
    <span class="ico"><!-- Courses: book-open -->
      <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18V5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4a2 2 0 0 1 2 2v13"/><path d="M3 18a2 2 0 0 0 2 2h5a2 2 0 0 1 2 2 2 2 0 0 1 2-2h5a2 2 0 0 0 2-2"/></svg>
    </span>
    <span class="lbl">Courses</span>
  </div>
  <div class="tab">
    <span class="ico"><!-- Progress: bar-chart-2 -->
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </span>
    <span class="lbl">Progress</span>
  </div>
</div>

<div class="dots">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div class="cap">Lucide icons · 22×22 · stroke 2 (2.4 when active)</div>

</body></html>
